     #run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}
      

      - name: publish-windows
        working-directory: ${{env.GITHUB_WORKSPACE}}
        ###run: dotnet publish -c Release -f ${{ env.NETVERSION }} -p:RuntimeIdentifierOverride=win10-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:WindowsAppSDKSelfContained=true
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish-windows
    
      - name: publish-linux
        # working-directory: ${{env.GITHUB_WORKSPACE}}
        run: dotnet publish -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o ./publish-linux

          
      #
      # ###dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
      # ###dotnet publish -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true
      
    # - name: publish-windows
      # working-directory: ${{env.GITHUB_WORKSPACE}}
      # run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true

    # - name: publish-linux
      # working-directory: ${{env.GITHUB_WORKSPACE}}
      # run: dotnet publish -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true

       
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false    
          tag_name: ${{ env.NOW }}
          body: ${{ github.event.head_commit.message }}
          files: ${{ github.workspace }}/publish-windows/Tamagotchi-Pet-Game-console.exe, ${{ github.workspace }}/publish-linux/Tamagotchi-Pet-Game-console
          name: "Release ${{ env.NOW }}"
   
        
